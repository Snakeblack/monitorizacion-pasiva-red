approvals:
  - id: s02-clarify-001
    gate: architecture
    decision: accepted
    source: codex/plain-chat
    accepted_at: 2026-09-24T17:31:43Z
    applies_to: [sdd-clarify, sdd-design, sdd-tasks, sdd-apply, sdd-verify]
    details: 'IDs como cadenas no vacias de hasta 128 caracteres; occurredAt RFC 3339 UTC con Z y precision maxima de milisegundos; data objeto JSON; events con al menos un elemento. Cuota en ventana movil de 60 segundos para eventos nuevos confirmados; reenvios identicos no consumen. Contador una vez por solicitud rechazada con identidad confiable; sin identidad a contador agregado. HTTP 401 identidad ausente, 403 ambito discrepante. HTTP 200 con cuerpo vacio para nuevos y reenvios identicos.'
  - id: intent-briefing-001
    gate: intent-briefing
    decision: accepted
    source: codex/plain-chat
    accepted_at: 2026-09-24T17:09:45Z
    applies_to: [change-classification]
    synthesis: 'Definir el contrato JSON v1 de S02 e implementar ingestión durable por sede y sonda con ACK solo tras commit, deduplicación de reenvíos idénticos y rechazo de IDs reutilizados con contenido distinto.'
    scope: 'S02 según docs/development/slices.md; incluye validación, bandeja durable, cuotas y señales por sede/sonda, pruebas de rollback y aislamiento; excluye proyección, lectura y UI de S03 en adelante.'
  - id: execution-mode-001
    gate: execution-mode
    decision: auto
    source: codex/plain-chat
    accepted_at: 2026-09-24T17:13:02Z
    applies_to: [sdd-workflow]
  - id: delivery-strategy-001
    gate: delivery-strategy
    decision: auto-chain
    source: codex/plain-chat
    accepted_at: 2026-09-24T17:13:02Z
    applies_to: [sdd-tasks, sdd-apply]
  - id: s02-contract-001
    gate: architecture
    decision: accepted
    source: codex/plain-chat
    accepted_at: 2026-09-24T17:22:52Z
    applies_to: [sdd-spec, sdd-design, sdd-tasks, sdd-apply, sdd-verify]
    details: 'Lote atomico JSON v1 con schemaVersion 1, batchId, siteId, sensorId y events; cada evento tiene eventId, occurredAt UTC y data. Maximo 1 MiB y 500 eventos; rechazar version o campos desconocidos. HTTP 200 tras commit para nuevo o reenvio identico, 400 invalido, 409 ID con contenido distinto, 429 cuota. Igualdad por valor JSON sin ordenar arrays. Identidad de sede y sonda de contexto confiable del host, coincidente con lote. Cuota por sonda de 500 eventos/minuto y contador de rechazos por sede/sonda.'
  - id: s02-new-scope-001
    gate: new-scope
    decision: accepted
    source: codex/plain-chat
    accepted_at: 2026-09-25T19:41:31Z
    applies_to: [verify_lineage, sdd-apply, sdd-verify]
    details: 'Usuario autorizó ampliar exclusivamente C-01 a tests/Monitoring.Tests/InboxSchemaTests.cs para validar la nueva columna que conserva occurredAt original.'
