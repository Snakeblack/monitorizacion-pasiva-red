phases:
  explore:
    status: done
    artifact: openspec/changes/s04-vista-angular/exploration.md
    summary: No hay frontend. La API de detalle S03 exige Development/Testing y un contexto de lectura de confianza que el
      host no expone al navegador. Recomendado Angular en src/monitoring-web, pruebas con @angular/build:unit-test y un puente
      de ámbito solo en desarrollo, configurado en el servidor.
    key_decisions:
    - spa-en-src-monitoring-web
    - runner-angular-build-unit-test
    - puente-ambito-dev-por-configuracion-servidor
  proposal:
    status: done
    artifact: openspec/changes/s04-vista-angular/proposal.md
    summary: SPA en src/monitoring-web, cliente HTTP del detalle existente. El host instala el ámbito solo en Development/Testing
      desde configuración de servidor. La prueba de componente y la cadena hasta la UI usan el runner oficial de Angular;
      la versión se confirma en diseño. Sin Playwright.
    key_decisions:
    - spa-con-proxy-sin-servirla-desde-el-host
    - contexto-lectura-por-configuracion-servidor
    - runner-oficial-sin-playwright
  spec:
    status: done
    artifacts:
    - openspec/changes/s04-vista-angular/specs/vista-detalle-sesion/spec.md
    - openspec/changes/s04-vista-angular/specs/detalle-sesion-ambito/spec.md
    summary: Vista nueva con detalle, vacío y error, y delta del ámbito de lectura solo desde configuración del servidor en
      Development/Testing. Sin ambigüedad residual.
  clarify:
    status: skipped
    summary: 'Envelope validado: residual_ambiguity false y tres arrays vacíos.'
  design:
    status: done
    artifact: openspec/changes/s04-vista-angular/design.md
    summary: SPA Angular 22.2.0 en src/monitoring-web, cliente del GET, no servida por el host. El ámbito sale de TrustedSessionRead:SiteId
      y TrustedSessionRead:SensorId solo en Development/Testing. La cadena usa @angular/build:unit-test y Kestrel en loopback.
      ADR-001 y ADR-002.
    key_decisions:
    - angular-22-2-0-sin-servir-desde-el-host
    - ambito-por-configuracion-dev-testing
    - cadena-unit-test-kestrel-loopback
  tasks:
    status: done
    artifact: openspec/changes/s04-vista-angular/tasks.md
    summary: 30 tareas en cinco fases. MUST cubiertos. Forecast 1100–1700 líneas, riesgo High, chained PRs recomendadas, chain
      strategy pending. Apply detenido hasta decisión de carga de revisión.
    key_decisions:
    - host-antes-de-la-spa
    - tdd-por-escenario
    - size-exception-pendiente
  apply:
    status: done
    artifact: openspec/changes/s04-vista-angular/apply-progress.md
    summary: 30 tareas verificadas en cinco lotes. Host con ámbito por configuración, SPA Angular 22.2.0, ficha con estados,
      cadena fixture→UI y CI. dotnet test Monitoring.slnx 122/122. Entrega size:exception.
    key_decisions:
    - feature-solo-dev-testing-desde-configuracion
    - cadena-en-el-mismo-job-de-ci
    - publish-del-host-sin-spa
  verify:
    status: done
    verdict: PASS WITH WARNINGS
    artifact: openspec/changes/s04-vista-angular/verify-report.md
    summary: Recheck cerró S04-C001; ng test en rojo y centinela ausente. W001 y W002 siguen advisory.
    key_decisions:
    - S04-C001 queda resuelto por la observación del ng test en rojo
    - La puerta tests no se reejecutó; valen los comandos congelados
    - S04-W001 y S04-W002 siguen advisory
assumptions:
- id: sdd-propose-001
  phase: sdd-propose
  statement: La integración hasta la UI renderiza el GET real con @angular/build:unit-test contra el host de Testing, sin
    herramienta E2E.
  reversibility: high
  basis: openspec/config.yaml declara e2e no disponible y la entrega persistida es un solo PR.
  recorded_at: '2026-09-30T13:14:34.531Z'
  status: unresolved
- id: sdd-apply-001
  phase: sdd-apply
  statement: Ambos valores de TrustedSessionRead se consideran ausentes si son null o whitespace (IsNullOrWhiteSpace); no
    se rechazan espacios internos.
  reversibility: high
  basis: 'design.md: los dos valores, sin espacios, o no hay feature; patrón de IConfiguration en el host.'
  recorded_at: '2026-09-30T13:53:52.254Z'
  status: unresolved
- id: sdd-apply-002
  phase: sdd-apply
  statement: SessionDetailPage en Phase 2 es un placeholder OnPush vacío para que compile la ruta /sessions/:eventId; GET
    y estados quedan en Phase 3.
  reversibility: high
  basis: tasks.md 2.4 vs 3.3–3.10; design.md asigna la ficha y HttpTestingController a Phase 3.
  recorded_at: '2026-09-30T14:06:16.115Z'
  status: unresolved
- id: sdd-apply-003
  phase: sdd-apply
  statement: SESSION_DETAIL_API_ORIGIN se inyecta con factory vacía; Phase 4 lo sobreescribe para la cadena.
  reversibility: high
  basis: 'design.md: origin vacío usa el proxy; SESSION_DETAIL_API_ORIGIN solo lo pone la cadena.'
  recorded_at: '2026-09-30T14:29:18.497Z'
  status: unresolved
- id: sdd-apply-004
  phase: sdd-apply
  statement: SessionViewChainHost fija UseContentRoot a src/Monitoring.Host caminando hasta Monitoring.slnx porque dotnet
    run no aplica el manifest de testhost.
  reversibility: high
  basis: DirectoryNotFoundException de {cwd}/Monitoring.Host al lanzar --view-chain desde la raíz del repo.
  recorded_at: '2026-09-30T14:48:55.772Z'
  status: unresolved
- id: sdd-apply-005
  phase: sdd-apply
  statement: 'El spec de cadena usa shims locales de módulos node: en lugar de añadir @types/node.'
  reversibility: high
  basis: El compilador Angular exige tipos Node para spawn; el contrato prohíbe un runner Vitest de terceros, no tipos.
  recorded_at: '2026-09-30T14:48:55.772Z'
  status: unresolved
