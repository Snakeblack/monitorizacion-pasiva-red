schema: spec-driven
scale: enterprise
project:
  status: foundation-defined
  name: monitorizacion-pasiva-red
  architecture: modular-ingestion-proposed
  stack:
    status: proposed
    languages: [.NET/C#, TypeScript]
    frameworks: [ASP.NET Core, Angular]
    components: [tshark, PostgreSQL provisional per ADR-014, OIDC identity provider]
    architecture: modular-api-and-ingestion-worker
    package_managers: [dotnet]
  commands:
    install: dotnet restore Monitoring.slnx
    build: dotnet build Monitoring.slnx --no-restore
    test: dotnet test Monitoring.slnx
    lint: []
    format: []
    typecheck: []
context: |
  Proyecto nuevo de monitorización pasiva de red con primera entrega de producción multisede y documentación arquitectónica justificativa.
  El caso práctico se conserva en docs/references/raw/network-monitoring.pdf y se procesa en docs/references/processed/network-monitoring.md.
  El análisis inicial se conserva en docs/references/raw/arquitectura-monitorizacion-red.pdf y se procesa en docs/references/processed/arquitectura-monitorizacion-red.md.
  La documentación persistida del proyecto se escribirá en español y justificará decisiones, flujos y alternativas.
  No existe aún código ni arquitectura implementada. ADR-010 propone las piezas; ADR-013 sustituye los límites de piloto de ADR-012 y fija objetivos de aceptación de producción (4 sedes, 8 sondas, 10 millones de sesiones/día, 30 días consultables). Son requisitos de ensayo, no capacidad medida ni política corporativa aprobada. S00 documenta un modelo de capacidad reproducible y ADR-014 adopta PostgreSQL provisionalmente para iniciar S01. Los ensayos de capacidad, recuperación y coste con la implementación confirman o revisan la decisión antes de liberar; Kafka, ClickHouse y otros servicios se deciden por cuello y coste demostrados. Producción exige validación de carga, datos, seguridad, continuidad, plataforma y guardia; no hay herramientas de prueba instaladas.
testing:
  tdd_mode: strict
  runner: xUnit
  test_command: dotnet test Monitoring.slnx
  test_layers:
    unit: { available: true, tool: xUnit }
    integration: { available: true, tool: Testcontainers PostgreSQL }
    e2e: { available: false, tool: null }
  coverage: { available: false, command: "" }
  quality_tools:
    linter: { available: false, command: "" }
    type_checker: { available: false, command: "" }
    formatter: { available: false, command: "" }
capabilities:
  - name: dotnet
    version: "10.0.303"
    source: declared
  - name: xunit
    version: "2.9.3"
    source: declared
  - name: testcontainers-postgresql
    version: "4.15.0"
    source: declared
  - name: docker
    source: declared
  - name: github-actions
    source: declared
  - name: postgres
    version: "18-alpine"
    source: declared
traceability:
  trailers: required
mentorship:
  mode: balanced
quality_gates:
  tests:
    required: true
    on_fail: halt
    command: dotnet test Monitoring.slnx
    timeout_ms: 180000
rules:
  foundation:
    - No inventar stack, capacidades, requisitos ni decisiones que no estén respaldados por los documentos o por respuestas del usuario.
    - Persistir los documentos fuente bajo docs/references/raw/ y sus versiones Markdown en español bajo docs/references/processed/.
    - Documentar decisiones arquitectónicas con contexto, alternativas consideradas, criterios, consecuencias y razones para elegir herramientas frente a otras.
    - No crear código de aplicación durante la fase foundation.
  proposal:
    - Incluir plan de reversión para cambios de riesgo.
  specs:
    - Usar escenarios Given/When/Then y requisitos normativos claros.
  design:
    - Explicar decisiones arquitectónicas, flujos, límites y consecuencias; incluir diagramas de secuencia cuando aporten claridad.
  tasks:
    - Organizar tareas por fases y estimar el presupuesto de revisión de 400 líneas.
  apply:
    - Seguir Strict TDD; no iniciar implementación sin un runner de pruebas acordado y configurado.
  verify:
    - En escala enterprise, configurar las puertas de calidad con on_fail: halt cuando se hayan confirmado comandos y herramientas del proyecto.
  archive:
    - No archivar cambios sin verificación satisfactoria y riesgos aceptados.

foundation:
  product_brief: docs/product/brief.md
  functional_scope: docs/product/functional-scope.md
  glossary: docs/product/glossary.md
  technical_baseline: docs/architecture/technical-baseline.md
  decisions_index: docs/architecture/decisions/README.md
  roadmap: docs/roadmap.md
  roadmap_gaps: docs/roadmap-gaps.md
  sources:
    - docs/references/raw/network-monitoring.pdf
    - docs/references/raw/arquitectura-monitorizacion-red.pdf
  open_questions:
    - Validar con la implementación el modelo S00, las cargas y consultas de ADR-013; confirmar o revisar PostgreSQL provisional y su coste antes de liberar.
    - Medir perfil real de red por sede/sonda, pérdidas, tamaño de evento y distribución de consultas.
    - Ratificar con producto, seguridad y cumplimiento plazos de datos, matriz de permisos y alcance contractual de disponibilidad/recuperación.
    - Inventariar servicios corporativos de identidad, certificados, HA, copias, observabilidad y guardia; ensayar integración, conmutación y restauración.



routing:
  - name: standard
    description: Flujo SDD completo para cambios normales y de alto riesgo.
    classification: [normal, high-risk]
    conditions:
      classification: [normal, high-risk]
    phases: [sdd-explore, sdd-propose, sdd-spec, sdd-design, sdd-tasks, sdd-apply, sdd-verify, sdd-archive]
    gates: [clarify, review-workload, quality-review-gate]

