name: S01 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Monitoring.slnx

      - name: Build
        run: dotnet build Monitoring.slnx --no-restore

      - name: Test with Docker-backed PostgreSQL
        run: dotnet test Monitoring.slnx --no-build
