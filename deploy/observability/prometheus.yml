# Laboratory Prometheus (ADR-020): evaluates the product's alert rules; there is no Alertmanager and no Grafana.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.rules.yml
scrape_configs:
  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: elasticsearch
    static_configs: [{targets: ["elasticsearch-exporter:9114"]}]
  - job_name: connect
    static_configs: [{targets: ["connect:9404"]}]
# The API pushes its own meters over OTLP to /api/v1/otlp/v1/metrics (ADR-021); nothing to scrape for it.
